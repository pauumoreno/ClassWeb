
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Alta clasifica</title>
</head>
<body>
    <div style="border:1px solid black; margin:20px; padding:15px;">
        <h1>Alta clasifica</h1>

        <form name="clasifica">
            <table>
                <tr>
                    <td>
                        <label for="idCategoria">
                            Categoria - idCategoria:
                        </label>
                    </td>
                    <td>
                        <input type="text"
                               id="idCategoria"
                               name="idCategoria">
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="idProducto">
                            Producto - idProducto:
                        </label>
                    </td>
                    <td>
                        <input type="text"
                               id="idProducto"
                               name="idProducto">
                    </td>
                </tr>
            </table>

            <button type="button"
                    onclick="location.href='./clasifica.html'">
                Guardar
            </button>

            <button type="button"
                    onclick="location.href='./clasifica.html'">
                Volver
            </button>
        </form>
    </div>
</body>
</html>
